# Ponctuel : remet en français les notes des versions publiées. Retiré juste après.
name: Notes de version en français
on: workflow_dispatch
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Réécrire les notes
        run: |
          set -euo pipefail
          gh release edit v2.1.0 --notes $'- L\'application suit la langue du téléphone, en 11 langues\n- Les notes de version s\'affichent dans votre langue'
          gh release edit v2.0.3 --notes $'- Correction de bugs\n- Optimisation de l\'utilisation de la batterie'
          gh release edit v2.0.2 --notes $'- Nouvelle barre de navigation flottante\n- L\'épaisseur du trait se choisit pour chaque parcours, avec sa couleur'
          gh release edit v2.0.1 --notes $'- Le point de position repasse au bleu'
          gh release edit v2.0 --notes $'- Refonte de l\'interface'
          gh release edit v1.3.1 --notes $'- Correction de plusieurs failles de sécurité'
          gh release edit v1.3 --notes $'- Réduction de la consommation de batterie'
          gh release edit v1.2 --notes $'- Correction d\'une faille de sécurité'
          gh release edit v1.1 --notes $'- Chargement de la carte nettement plus rapide, en vue satellite surtout\n- L\'outil de conversion CSV a été retiré'
          gh release edit v1.0 --notes $'Première version stable'
