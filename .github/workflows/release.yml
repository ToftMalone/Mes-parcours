name: Publish a release

# Two ways to publish, for the same result: a signed APK, update.json, and the
# GitHub release that the app queries to offer the update.
#
# 1. Push an annotated tag — the canonical route from a development machine:
#
#      git tag -a v2.1.0 -m "Title" -m "First change" -m "Second change"
#      git push origin v2.1.0
#
#    The tag body becomes the release notes, one bullet per line.
#
# 2. Run the workflow by hand (Actions tab), entering the notes. The tag is then
#    deduced from versionName and created by the publication itself.
#
#    This second route is not a mere convenience: creating a tag requires write
#    rights on refs that not every environment has — a remote session can push
#    code and still be refused a tag. Without it, a development machine would be
#    needed to publish anything at all.
#
# Notes are written in English. A manual run can also carry translations (the
# `notes_i18n` input, a JSON object keyed by language code): the app shows the ones
# matching the phone's language and falls back on the English notes.

# Actions pinned by commit identifier, never by tag (`@v4`).
#
# A tag moves: its author — or whoever steals their account — can make it point
# tomorrow at other code, which would run here with nothing changing in this file.
# That is what happened in 2025 to tj-actions/changed-files. The stake is the
# signing key: setup-gradle injects its own code into Gradle, the very Gradle that
# signs the APK with the keystore password. Whoever holds the key can publish an
# update that the app would install as legitimate.
#
# The readable version is in a comment to the right of each identifier. To bump a
# version, look up the commit of the new tag
# (`git ls-remote https://github.com/<action>.git 'refs/tags/<version>^{}'`, or without
# `^{}` for a lightweight tag) and replace identifier and comment together.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes in English, one change per line"
        required: true
        type: string
      notes_i18n:
        description: 'Optional translations as JSON, e.g. {"fr":["Première nouveauté"],"es":["Primera novedad"]}'
        required: false
        default: '{}'
        type: string

# Needed to create the release and attach the files to it.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The tag message serves as release notes: the history is needed.
          fetch-depth: 0

      - name: Install the JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare the Android SDK
        # The runner already carries a complete Android SDK, cmdline-tools and
        # sdkmanager included; only the license acceptance was missing.
        # android-actions/setup-android@v3 used to handle it, until it failed
        # overnight: it first tries to install the legacy « tools » package, which
        # Google removed from its repository — so no version installs any more,
        # whatever the project. We accept the licenses ourselves, without depending
        # on the action for so simple a gesture.
        #
        # `|| true` is not there out of mere caution: `yes | sdkmanager` closes its
        # input before `yes` has finished writing, which makes it exit with an error
        # (SIGPIPE) although sdkmanager did accept the licenses. GitHub Actions'
        # step shell enables `pipefail`, which would fail the step on a success. A
        # real acceptance failure would show up anyway at the compilation that follows.
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install the target platform
        run: |
          sdkmanager --install "platforms;android-36" || true
          sdkmanager --install "platforms;android-36.1" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Run the tests
        # A release must never be published if the test suite fails.
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Attach the test reports
        # A release blocked by the tests must say why: Gradle's log only names the
        # test, never the exception that made it fail.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing. See CLAUDE.md, section \"Publishing a release\"."
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/upload.jks"

      - name: Build the signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepare the APK, the notes and update.json
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_NOTES: ${{ inputs.notes }}
          DISPATCH_NOTES_I18N: ${{ inputs.notes_i18n }}
        run: |
          set -euo pipefail

          VERSION_CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION_NAME}"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # Safeguard: publishing a tag without having bumped the version would
            # produce a release that nobody could install over the previous one.
            if [ "${TAG}" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${VERSION_NAME}. Expected: ${TAG}"
              exit 1
            fi
            # The notes come from the annotated tag body, one bullet per non-empty line.
            NOTES=$(git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" || true)
          else
            # Manual run: the tag being deduced from versionName, it cannot diverge
            # from the compiled version — the safeguard above would have nothing to
            # check. What remains is refusing to overwrite an already published version.
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "::error::Version ${TAG} is already published. Bump versionCode and versionName in app/build.gradle.kts before republishing."
              exit 1
            fi
            NOTES="${DISPATCH_NOTES}"
          fi

          # Optional translations (manual runs only). Anything that is not a JSON object
          # is ignored rather than failing a release over a typo in a translation.
          NOTES_I18N='{}'
          if [ "${GITHUB_EVENT_NAME}" != "push" ] && [ -n "${DISPATCH_NOTES_I18N:-}" ]; then
            NOTES_I18N=$(printf '%s' "${DISPATCH_NOTES_I18N}" | jq -c 'if type == "object" then . else {} end' 2>/dev/null || echo '{}')
          fi

          printf '%s\n' "${NOTES}" | grep -v '^[[:space:]]*$' | sed 's/^/- /' > notes.md
          NOTES_JSON=$(printf '%s\n' "${NOTES}" | grep -v '^[[:space:]]*$' | jq -R . | jq -s . || echo '[]')

          APK_NAME="mes-parcours-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"

          # Fingerprint of the published APK. The app compares it with what it
          # downloaded before presenting it to the installer: a file truncated along
          # the way is thus discarded instead of failing later, obscurely.
          APK_SHA256=$(sha256sum "${APK_NAME}" | cut -d' ' -f1)

          jq -n \
            --argjson versionCode "${VERSION_CODE}" \
            --arg versionName "${VERSION_NAME}" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}" \
            --arg sha256 "${APK_SHA256}" \
            --argjson notes "${NOTES_JSON}" \
            --argjson notesI18n "${NOTES_I18N}" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, notes: $notes, notesI18n: $notesI18n}' \
            > update.json

          echo "apk=${APK_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "versionName=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"

          echo "update.json produced:"
          cat update.json
          echo "Release notes:"
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Like the notes above, these three values go through the environment
          # rather than being interpolated into the command: `${{ }}` is replaced
          # before the shell sees the line, so a shell character in the versionName
          # would execute instead of being a name.
          TAG: ${{ steps.prepare.outputs.tag }}
          APK: ${{ steps.prepare.outputs.apk }}
          VERSION_NAME: ${{ steps.prepare.outputs.versionName }}
        run: |
          set -euo pipefail
          # update.json must carry exactly this name: the app looks for it at the URL
          # releases/latest/download/update.json.
          #
          # --target only has an effect if the tag does not exist yet: gh then creates
          # it on this commit. On a tag-triggered run, the tag already exists and the
          # option does nothing.
          gh release create "${TAG}" \
            "${APK}" \
            update.json \
            --target "${GITHUB_SHA}" \
            --title "Mes parcours ${VERSION_NAME}" \
            --notes-file notes.md
