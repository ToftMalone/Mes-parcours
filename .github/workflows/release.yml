name: Publier une version

# Deux façons de publier, pour un même résultat : APK signé, update.json, et la
# publication GitHub que l'application interroge pour proposer la mise à jour.
#
# 1. Poser un tag annoté — la voie canonique depuis un poste de développement :
#
#      git tag -a v0.9.9-thierry -m "Titre" -m "Première nouveauté" -m "Deuxième"
#      git push origin v0.9.9-thierry
#
#    Le corps du tag devient les notes de version, une puce par ligne.
#
# 2. Lancer le workflow à la main (onglet Actions), en saisissant les notes. Le tag
#    est alors déduit du versionName et créé par la publication elle-même.
#
#    Cette seconde voie n'est pas un raccourci de confort : créer un tag exige des
#    droits d'écriture sur les références que tout environnement n'a pas — une
#    session distante peut pousser du code et se voir refuser un tag. Sans elle, il
#    faudrait un poste de développement sous la main pour publier quoi que ce soit.

# Actions épinglées par identifiant de commit, jamais par étiquette (`@v4`).
#
# Une étiquette se déplace : son auteur — ou quiconque dérobe son compte — peut la
# faire pointer demain sur un autre code, qui s'exécuterait ici sans que rien ne
# change dans ce fichier. C'est ce qui est arrivé en 2025 à tj-actions/changed-files.
# L'enjeu est la clé de signature : setup-gradle injecte son propre code dans Gradle,
# celui-là même qui signe l'APK avec le mot de passe du trousseau. Qui tient la clé
# peut publier une mise à jour que l'application installerait comme légitime.
#
# La version lisible est en commentaire à droite de chaque identifiant. Pour monter
# de version, relever le commit de la nouvelle étiquette
# (`git ls-remote https://github.com/<action>.git 'refs/tags/<version>^{}'`, ou sans
# `^{}` pour une étiquette légère) et remplacer identifiant et commentaire ensemble.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notes:
        description: "Notes de version, une nouveauté par ligne"
        required: true
        type: string

# Nécessaire pour créer la publication et y joindre les fichiers.
permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Le message du tag sert de notes de version : il faut l'historique.
          fetch-depth: 0

      - name: Installer le JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Préparer le SDK Android
        # Le runner porte déjà un SDK Android complet, cmdline-tools et sdkmanager
        # compris ; il ne manquait que l'acceptation des licences.
        # android-actions/setup-android@v3 s'en chargeait, jusqu'à ce qu'elle échoue
        # du jour au lendemain : elle tente d'abord d'installer le paquet historique
        # « tools », que Google a retiré de son dépôt — plus aucune version ne
        # l'installe donc plus, quel que soit le projet. On accepte les licences
        # nous-mêmes, sans dépendre de l'action pour un geste aussi simple.
        #
        # `|| true` n'est pas là par prudence de principe : `yes | sdkmanager`
        # ferme son entrée avant que `yes` ait fini d'écrire, ce qui la fait
        # sortir en erreur (SIGPIPE) alors que sdkmanager, lui, a bien accepté les
        # licences. Le shell des étapes GitHub Actions active `pipefail`, qui
        # ferait donc échouer l'étape sur un succès. Un vrai échec d'acceptation
        # se verrait de toute façon à la compilation qui suit.
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Installer la plateforme visée
        run: |
          sdkmanager --install "platforms;android-36" || true
          sdkmanager --install "platforms;android-36.1" || true

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Lancer les tests
        # Une version ne doit jamais être publiée si la suite de tests échoue.
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Joindre les rapports de test
        # Une version bloquée par les tests doit dire pourquoi : le journal de Gradle
        # ne nomme que le test, jamais l'exception qui l'a fait tomber.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapports-de-test
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Restituer le trousseau de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::Le secret KEYSTORE_BASE64 est absent. Voir CLAUDE.md, section « Publier une version »."
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/upload.jks"

      - name: Compiler la version signée
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Préparer l'APK, les notes et update.json
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail

          VERSION_CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION_NAME}"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # Garde-fou : publier un tag sans avoir incrémenté la version produirait
            # une publication que personne ne pourrait installer par-dessus.
            if [ "${TAG}" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à versionName ${VERSION_NAME}. Attendu : ${TAG}"
              exit 1
            fi
            # Les notes viennent du corps du tag annoté, une puce par ligne non vide.
            NOTES=$(git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" || true)
          else
            # Déclenchement manuel : le tag étant déduit du versionName, il ne peut
            # pas diverger de la version compilée — le garde-fou ci-dessus n'aurait
            # rien à vérifier. Reste à refuser d'écraser une version déjà publiée.
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "::error::La version ${TAG} est déjà publiée. Incrémentez versionCode et versionName dans app/build.gradle.kts avant de republier."
              exit 1
            fi
            NOTES="${DISPATCH_NOTES}"
          fi

          printf '%s\n' "${NOTES}" | grep -v '^[[:space:]]*$' | sed 's/^/- /' > notes.md
          NOTES_JSON=$(printf '%s\n' "${NOTES}" | grep -v '^[[:space:]]*$' | jq -R . | jq -s . || echo '[]')

          APK_NAME="mes-parcours-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"

          # Empreinte de l'APK publié. L'application la compare à ce qu'elle a
          # téléchargé avant de le présenter à l'installateur : un fichier tronqué
          # en route est ainsi écarté au lieu d'échouer plus tard, de façon obscure.
          APK_SHA256=$(sha256sum "${APK_NAME}" | cut -d' ' -f1)

          jq -n \
            --argjson versionCode "${VERSION_CODE}" \
            --arg versionName "${VERSION_NAME}" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}" \
            --arg sha256 "${APK_SHA256}" \
            --argjson notes "${NOTES_JSON}" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, notes: $notes}' \
            > update.json

          echo "apk=${APK_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "versionName=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"

          echo "update.json produit :"
          cat update.json
          echo "Notes de version :"
          cat notes.md

      - name: Créer la publication
        env:
          GH_TOKEN: ${{ github.token }}
          # Comme les notes plus haut, ces trois valeurs passent par l'environnement
          # plutôt que d'être interpolées dans la commande : `${{ }}` est remplacé
          # avant que le shell ne voie la ligne, si bien qu'un caractère de shell
          # dans le versionName s'exécuterait au lieu d'être un nom.
          TAG: ${{ steps.prepare.outputs.tag }}
          APK: ${{ steps.prepare.outputs.apk }}
          VERSION_NAME: ${{ steps.prepare.outputs.versionName }}
        run: |
          set -euo pipefail
          # update.json doit porter exactement ce nom : l'application le cherche à
          # l'URL releases/latest/download/update.json.
          #
          # --target n'a d'effet que si le tag n'existe pas encore : gh le crée alors
          # sur ce commit. Sur un déclenchement par tag, le tag existe déjà et
          # l'option est sans effet.
          gh release create "${TAG}" \
            "${APK}" \
            update.json \
            --target "${GITHUB_SHA}" \
            --title "Mes parcours ${VERSION_NAME}" \
            --notes-file notes.md
